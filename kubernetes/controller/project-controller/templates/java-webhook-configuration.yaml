apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: java.project-controller.project.aipub.ten1010.io
webhooks:
  - name: userrelationship.project-controller.project.aipub.ten1010.io
    admissionReviewVersions: [ "v1" ]
    clientConfig:
      caBundle: <CA_BUNDLE>
      service:
        namespace: project-controller
        name: project-controller
        path: /api/v1/userrelationship/mutate
        port: 8080
    failurePolicy: Fail
    matchPolicy: Equivalent
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kube-public
            - kube-node-lease
            - kube-flannel
            - aipub
            - coaster
            - harbor
            - ingress-nginx
            - keycloak
            - linkerd
            - metallb
            - project-controller
            - aipub-promstack
            - trident
            - aipub-efk
    objectSelector: { }
    reinvocationPolicy: IfNeeded
    rules:
      - apiGroups: [ "" ]
        apiVersions: [ "*" ]
        operations: [ "CREATE" ]
        resources: [ "pods", "replicationcontrollers", "services", "configmaps", "secrets", "persistentvolumeclaims" ]
        scope: "Namespaced"
      - apiGroups: [ "networking.k8s.io" ]
        apiVersions: [ "*" ]
        operations: [ "CREATE" ]
        resources: [ "ingresses" ]
        scope: "Namespaced"
      - apiGroups: [ "batch" ]
        apiVersions: [ "*" ]
        operations: [ "CREATE" ]
        resources: [ "*" ]
        scope: "Namespaced"
      - apiGroups: [ "apps" ]
        apiVersions: [ "*" ]
        operations: [ "CREATE" ]
        resources: [ "*" ]
        scope: "Namespaced"
      - apiGroups: [ "aipub.ten1010.io" ]
        apiVersions: [ "*" ]
        operations: [ "CREATE" ]
        resources: [ "*" ]
        scope: "Namespaced"
      # Namespace 오브젝트에는 namespaceSelector 가 오브젝트 자신의 라벨에 평가되므로
      # 위 kubernetes.io/metadata.name NotIn 제외 목록이 시스템 네임스페이스 생성에 그대로 적용된다.
      - apiGroups: [ "" ]
        apiVersions: [ "v1" ]
        operations: [ "CREATE" ]
        resources: [ "namespaces" ]
        scope: "Cluster"
      # AIP-2665: cluster-scoped ClusterVolume 의 CREATE 를 인터셉트해 생성자 AipubUser
      # ownerReference 를 붙인다 (AipubUser 삭제 시 GC 로 함께 정리). cluster-scoped 리소스에는
      # namespaceSelector 가 평가되지 않으므로 위 제외 목록과 무관하게 모든 생성이 경유한다 —
      # 비멤버(백엔드 SA·시스템 컴포넌트) 생성은 핸들러가 무변경 통과시킨다.
      # 소유권 기반 update/delete RBAC 대상은 아니다(OwnershipPolicy 는 네임스페이스 리소스 전용).
      - apiGroups: [ "aipub.ten1010.io" ]
        apiVersions: [ "*" ]
        operations: [ "CREATE" ]
        resources: [ "clustervolumes" ]
        scope: "Cluster"
    sideEffects: None
    timeoutSeconds: 10
  - name: workload-label.project-controller.project.aipub.ten1010.io
    admissionReviewVersions: [ "v1" ]
    clientConfig:
      caBundle: <CA_BUNDLE>
      service:
        namespace: project-controller
        name: project-controller
        path: /api/v1/workloadlabel/mutate
        port: 8080
    failurePolicy: Fail
    matchPolicy: Equivalent
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kube-public
            - kube-node-lease
            - kube-flannel
            - aipub
            - coaster
            - harbor
            - ingress-nginx
            - keycloak
            - linkerd
            - metallb
            - project-controller
            - aipub-promstack
            - trident
            - aipub-efk
    objectSelector: { }
    reinvocationPolicy: IfNeeded
    rules:
      - apiGroups: [ "" ]
        apiVersions: [ "v1" ]
        operations: [ "CREATE" ]
        resources: [ "pods", "replicationcontrollers" ]
        scope: "Namespaced"
      - apiGroups: [ "apps" ]
        apiVersions: [ "v1" ]
        operations: [ "CREATE" ]
        resources: [ "daemonsets", "deployments", "replicasets", "statefulsets" ]
        scope: "Namespaced"
      - apiGroups: [ "batch" ]
        apiVersions: [ "v1" ]
        operations: [ "CREATE" ]
        resources: [ "jobs", "cronjobs" ]
        scope: "Namespaced"
    sideEffects: None
    timeoutSeconds: 10
  - name: userauthorityreview-mutate.project-controller.project.aipub.ten1010.io
    admissionReviewVersions: [ "v1" ]
    clientConfig:
      caBundle: <CA_BUNDLE>
      service:
        namespace: project-controller
        name: project-controller
        path: /api/v1/userauthorityreview/mutate
        port: 8080
    failurePolicy: Fail
    matchPolicy: Equivalent
    namespaceSelector: { }
    objectSelector: { }
    reinvocationPolicy: IfNeeded
    rules:
      - apiGroups: [ "aipub.ten1010.io" ]
        apiVersions: [ "*" ]
        operations: [ "CREATE" ]
        resources: [ "userauthorityreviews" ]
        scope: "*"
    sideEffects: None
    timeoutSeconds: 10
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: java.project-controller.project.aipub.ten1010.io
webhooks:
  - name: userauthorityreview-validate.project-controller.project.aipub.ten1010.io
    admissionReviewVersions: [ "v1" ]
    clientConfig:
      caBundle: <CA_BUNDLE>
      service:
        namespace: project-controller
        name: project-controller
        path: /api/v1/userauthorityreview/validate
        port: 8080
    failurePolicy: Fail
    matchPolicy: Equivalent
    namespaceSelector: { }
    objectSelector: { }
    rules:
      - apiGroups: [ "aipub.ten1010.io" ]
        apiVersions: [ "*" ]
        operations: [ "CREATE" ]
        resources: [ "userauthorityreviews" ]
        scope: "*"
    sideEffects: None
    timeoutSeconds: 10
