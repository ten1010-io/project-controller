                              type=INFERENCE 일 때만 유효. 생략하면 host 는 컨트롤러
                              기본 서브도메인, path 는 "/" 가 적용된다.
                            properties:
                              host:
                                maxLength: 63
                                minLength: 1
                                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                                type: string
                              path:
                                default: /
                                minLength: 1
                                pattern: ^/.*
                                type: string
                            type: object
                          tcp:
                            properties:
                              port:
                                format: int32
                                maximum: 65535
                                minimum: 1
                                type: integer
                            type: object
                          type:
                            enum:
                              - TCP
                              - HTTP
                              - INFERENCE
                            type: string
                        required:
                          - type
                        type: object
                      name:
                        maxLength: 15
                        minLength: 1
                        pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
                        type: string
                      port:
                        format: int32
                        maximum: 65535
                        minimum: 1
                        type: integer
                    required:
                      - name
                      - port
                    type: object
                    x-kubernetes-validations:
                      - message: expose.tcp must not be set when expose.type is HTTP
                        rule: '!has(self.expose) || self.expose.type != "HTTP" || !has(self.expose.tcp)'
                      - message: expose.http must not be set when expose.type is TCP
                        rule: '!has(self.expose) || self.expose.type != "TCP" || !has(self.expose.http)'
                      - message: expose.inference must not be set when expose.type is not INFERENCE
                        rule: '!has(self.expose) || self.expose.type == "INFERENCE" || !has(self.expose.inference)'
                      - message: expose.tcp and expose.http must not be set when expose.type is INFERENCE
                        rule: '!has(self.expose) || self.expose.type != "INFERENCE" || (!has(self.expose.tcp) && !has(self.expose.http))'
                  maxItems: 100
                  minItems: 1
                  type: array
                  x-kubernetes-validations:
                    - message: port must be unique
                      rule: self.all(x, size(self.filter(y, y.port == x.port)) == 1)
                    - message: name must be unique
                      rule: self.all(x, size(self.filter(y, y.name == x.name)) == 1)
                replicas:
                  format: int32
                  maximum: 2147483647
                  minimum: 0
                  type: integer
                revisionHistoryLimit:
                  default: 10
                  format: int32
                  minimum: 0
                  type: integer
                suspend:
                  default: false
                  type: boolean
                template:
                  properties:
                    metadata:
                      properties:
                        annotations:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                        labels:
                          additionalProperties:
                            maxLength: 63
                            pattern: ^(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])?$
                            type: string
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    spec:
                      properties:
                        containers:
                          items:
                            properties:
                              args:
                                items:
                                  type: string
                                type: array
                              command:
                                items:
                                  type: string
                                type: array
                              env:
                                items:
                                  properties:
                                    name:
                                      minLength: 1
                                      type: string
                                    value:
                                      type: string
                                    valueFrom:
                                      properties:
                                        configMapKeyRef:
                                          properties:
                                            key:
                                              minLength: 1
                                              type: string
                                            name:
                                              minLength: 1
                                              type: string
                                            optional:
                                              type: boolean
                                          required:
                                            - name
                                            - key
                                          type: object
                                        fieldRef:
                                          type: object
                                          x-kubernetes-preserve-unknown-fields: true
                                        resourceFieldRef:
                                          type: object
                                          x-kubernetes-preserve-unknown-fields: true
                                        secretKeyRef:
                                          properties:
                                            key:
                                              minLength: 1
                                              type: string
                                            name:
                                              minLength: 1
                                              type: string
                                            optional:
                                              type: boolean
                                          required:
                                            - name
                                            - key
                                          type: object
                                      type: object
                                  required:
                                    - name
                                  type: object
                                type: array
                              image:
                                minLength: 1
                                type: string
                              name:
                                minLength: 1
                                type: string
                              resources:
                                properties:
                                  claims:
                                    items:
                                      properties:
                                        name:
                                          minLength: 1
                                          type: string
                                      type: object
                                    type: array
                                  limits:
                                    type: object
                                    x-kubernetes-preserve-unknown-fields: true
                                  requests:
                                    type: object
                                    x-kubernetes-preserve-unknown-fields: true
                                type: object
                              volumeMounts:
                                items:
                                  properties:
                                    mountPath:
                                      minLength: 1
                                      pattern: ^[^:]*$
                                      type: string
                                    name:
                                      minLength: 1
                                      type: string
                                    readOnly:
                                      type: boolean
                                  required:
                                    - name
                                    - mountPath
                                  type: object
                                type: array
                              workingDir:
                                minLength: 1
                                type: string
                            required:
                              - name
                              - image
                            type: object
                          type: array
                          x-kubernetes-preserve-unknown-fields: true
                        hostname:
                          maxLength: 63
                          minLength: 1
                          type: string
                        volumes:
                          items:
                            properties:
                              name:
                                minLength: 1
                                type: string
                            required:
                              - name
                            type: object
                            x-kubernetes-preserve-unknown-fields: true
                          type: array
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                  required:
                    - spec
                  type: object
              required:
                - ports
                - replicas
                - template
              type: object
            status:
              properties:
                conditions:
                  items:
                    description: Condition contains details for one aspect of the current state of this API Resource.
                    properties:
                      lastTransitionTime:
                        description: |-
                          lastTransitionTime is the last time the condition transitioned from one status to another.
                          This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: |-
                          message is a human readable message indicating details about the transition.
                          This may be an empty string.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: |-
                          observedGeneration represents the .metadata.generation that the condition was set based upon.
                          For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                          with respect to the current state of the instance.
                        format: int64
