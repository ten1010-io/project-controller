                        maxScalingSizeAtOnce:
                          format: int32
                          minimum: 1
                          type: integer
                        periodSeconds:
                          format: int32
                          maximum: 1800
                          minimum: 1
                          type: integer
                        stabilizationWindowSeconds:
                          format: int32
                          maximum: 3600
                          minimum: 0
                          type: integer
                      type: object
                    scaleUp:
                      default:
                        maxScalingSizeAtOnce: 4
                        periodSeconds: 15
                        stabilizationWindowSeconds: 0
                      properties:
                        maxScalingSizeAtOnce:
                          format: int32
                          minimum: 1
                          type: integer
                        periodSeconds:
                          format: int32
                          maximum: 1800
                          minimum: 1
                          type: integer
                        stabilizationWindowSeconds:
                          format: int32
                          maximum: 3600
                          minimum: 0
                          type: integer
