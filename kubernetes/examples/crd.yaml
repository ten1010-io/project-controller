apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: workspaces.aipub.ten1010.io
spec:
  conversion:
    strategy: None
  group: aipub.ten1010.io
  names:
    categories:
      - all
    kind: Workspace
    listKind: WorkspaceList
    plural: workspaces
    shortNames:
      - ws
    singular: workspace
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .status.conditions[?(@.type=="Ready")].status
          name: READY
          type: string
        - jsonPath: .status.replicas
          name: REPLICAS
          type: integer
        - jsonPath: .status.readyReplicas
          name: READY-REPLICAS
          type: integer
        - jsonPath: .status.ssh.host
          name: SSH-HOST
          type: string
        - jsonPath: .status.ssh.port
          name: SSH-PORT
          type: integer
        - jsonPath: .metadata.creationTimestamp
          name: AGE
          type: date
      name: v1beta1
      schema:
        openAPIV3Schema:
          properties:
            metadata:
              type: object
            spec:
              properties:
                ports:
                  items:
                    properties:
                      appProtocol:
                        maxLength: 317
                        pattern: ^(([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*)/)?[A-Za-z0-9]([-A-Za-z0-9_.]{0,61}[A-Za-z0-9])?$
                        type: string
                      expose:
                        description: |-
                          외부 노출 설정(옵션). 없으면 ClusterIP 내부 전용. enabled=false 면 설정(host/path/tcp.port)은 유지한 채
                          노출만 일시정지. type=TCP: tcp.port 지정 시 그 포트, 비우면 컨트롤러 자동 할당. type=HTTP: hostname 기반 L7 라우팅.
                        properties:
                          enabled:
                            default: true
                            description: |-
                              노출 on/off. expose 를 쓰면 기본 노출(true). false 면 설정 유지한 채 노출만 정지(외부 포트/route 미생성).
                              토글 시 host/path/tcp.port 보존.
                            type: boolean
                          http:
                            properties:
                              host:
                                description: 외부 host 의 leftmost label. root domain 은 컨트롤러가 suffix 로 붙인다.
                                maxLength: 63
                                minLength: 1
                                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                                type: string
                              path:
                                default: /
                                pattern: ^/
                                type: string
                              tls:
                                default: true
                                type: boolean
                            required:
                              - host
                            type: object
                          inference:
                            description: type=INFERENCE 일 때만 유효. host 는 필수, path 기본 "/".
                            properties:
                              host:
                                description: 외부 host 의 leftmost label. root domain 은 컨트롤러가 suffix 로 붙인다.
                                maxLength: 63
                                minLength: 1
                                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                                type: string
                              path:
                                default: /
                                pattern: ^/
                                type: string
                            required:
                              - host
                            type: object
                          tcp:
                            description: type=TCP 일 때만 유효. 외부 포트를 명시하면 그 값을 사용, 비우면 컨트롤러가 설정 범위에서 자동 할당.
                            properties:
                              port:
                                format: int32
                                maximum: 65535
                                minimum: 1
                                type: integer
                            type: object
                          type:
                            enum:
                              - TCP
                              - HTTP
                              - INFERENCE
                            type: string
                        required:
                          - type
                        type: object
                      name:
                        maxLength: 15
                        minLength: 1
                        pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
                        type: string
                      port:
                        format: int32
                        maximum: 65535
                        minimum: 1
                        type: integer
                    required:
                      - name
                      - port
                    type: object
                    x-kubernetes-validations:
                      - message: expose.http must be set when expose.type is HTTP
                        rule: '!has(self.expose) || self.expose.type != ''HTTP'' || has(self.expose.http)'
                      - message: expose.tcp must not be set when expose.type is HTTP
                        rule: '!has(self.expose) || self.expose.type != ''HTTP'' || !has(self.expose.tcp)'
                      - message: expose.http must not be set when expose.type is TCP
                        rule: '!has(self.expose) || self.expose.type != ''TCP'' || !has(self.expose.http)'
                      - message: expose.inference must be set when expose.type is INFERENCE
                        rule: '!has(self.expose) || self.expose.type != ''INFERENCE'' || has(self.expose.inference)'
                      - message: expose.inference must not be set when expose.type is not INFERENCE
                        rule: '!has(self.expose) || self.expose.type == ''INFERENCE'' || !has(self.expose.inference)'
                      - message: expose.tcp and expose.http must not be set when expose.type is INFERENCE
                        rule: '!has(self.expose) || self.expose.type != ''INFERENCE'' || (!has(self.expose.tcp) && !has(self.expose.http))'
                  maxItems: 500
                  type: array
                  x-kubernetes-list-map-keys:
                    - name
                  x-kubernetes-list-type: map
                  x-kubernetes-validations:
                    - message: port must be unique
