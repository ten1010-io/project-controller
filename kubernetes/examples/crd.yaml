                      rule: self.maxReplicas > self.minReplicas
                ports:
                  items:
                    properties:
                      appProtocol:
                        maxLength: 317
                        pattern: ^(([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*)/)?[A-Za-z0-9]([-A-Za-z0-9_.]{0,61}[A-Za-z0-9])?$
                        type: string
                      expose:
                        properties:
                          enabled:
                            default: true
                            type: boolean
                          http:
                            properties:
                              host:
                                maxLength: 63
                                minLength: 1
                                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                                type: string
                              path:
                                default: /
                                minLength: 1
                                pattern: ^/.*
                                type: string
                              tls:
